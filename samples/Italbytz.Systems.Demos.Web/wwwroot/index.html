<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nuget-systems demos</title>
    <base href="/" />
    <meta name="description" content="Interactive Blazor demos for the nuget-systems package family." />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css?v=4" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Italbytz.Systems.Demos.Web.styles.css?v=4" rel="stylesheet" />
    <script>
        (function () {
            function checkEmbed() {
                var isEmbed = false;
                try {
                    isEmbed = window.self !== window.top ||
                              window.location.search.indexOf('embed=') !== -1 ||
                              window.location.search.indexOf('embedded=') !== -1;
                } catch (e) {
                    isEmbed = true;
                }
                var isLight = window.location.search.indexOf('theme=light') !== -1;
                var isDark = window.location.search.indexOf('theme=dark') !== -1;

                if (isEmbed) {
                    document.documentElement.classList.add('is-embedded');
                    if (document.body) {
                        document.body.classList.add('is-embedded');
                    }
                } else {
                    document.documentElement.classList.remove('is-embedded');
                    if (document.body) {
                        document.body.classList.remove('is-embedded');
                    }
                }

                if (isLight) {
                    document.documentElement.classList.add('is-light');
                    document.documentElement.classList.remove('is-dark');
                    if (document.body) {
                        document.body.classList.add('is-light');
                        document.body.classList.remove('is-dark');
                    }
                } else if (isDark) {
                    document.documentElement.classList.add('is-dark');
                    document.documentElement.classList.remove('is-light');
                    if (document.body) {
                        document.body.classList.add('is-dark');
                        document.body.classList.remove('is-light');
                    }
                }
            }
            checkEmbed();
            document.addEventListener('DOMContentLoaded', checkEmbed);
            window.addEventListener('popstate', checkEmbed);
        })();
    </script>
    <style media="print">
        .sidebar,
        .top-row,
        .hero-panel,
        .mode-switch-bar,
        .no-print,
        header,
        nav,
        .navbar,
        .nav-scrollable,
        .nav-sections,
        #blazor-error-ui {
            display: none !important;
            visibility: hidden !important;
            width: 0 !important;
            height: 0 !important;
            position: absolute !important;
            left: -9999px !important;
            top: -9999px !important;
        }

        html, body, #app, .page, main, .content {
            display: block !important;
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #ffffff !important;
            color: #000000 !important;
            overflow: visible !important;
            position: static !important;
        }
    </style>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
    <script>
        window.renderMath = function () {
            if (window.renderMathInElement) {
                renderMathInElement(document.body, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false }
                    ],
                    throwOnError: false
                });
            }
        };
        var mathObserver = new MutationObserver(function () {
            window.renderMath();
        });
        document.addEventListener('DOMContentLoaded', function () {
            mathObserver.observe(document.body, { childList: true, subtree: true });
        });
    </script>
</body>

</html>
